id: helpdesk
name: Helpdesk
version: 0.10.0
publisher: cbferrum
summary: Tickets that customers email to, on the platform's service targets, routed by skill and shift, with macros, ratings by link, a help centre, warranty claims and maintenance visits
description: README.md
categories: [support]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-helpdesk
support: https://github.com/CBFerrum/ferrum-app-helpdesk/issues
runtime: native
platform: ">=0.3.2, <0.4"
packages: [helpdesk]
uninstall: ask
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: helpdesk
      route: helpdesk
      title: Helpdesk
      description: The agent inbox, tickets and their conversations, saved replies, the knowledge base
      icon: headset
      color: "#7c3aed"
      roles: [Support Agent, Support Manager]
  shell.open:
    # A ticket opens in the ticket view; Helpdesk's other records in its forms and lists.
    - {id: ticket, entity: Ticket, path: "helpdesk/t/{id}", list: helpdesk/, priority: 1}
    - {id: helpdesk, package: helpdesk, path: "helpdesk/e/{entity}/{id}", list: "helpdesk/e/{entity}"}
  shell.create:
    - {id: ticket, label: Ticket, path: helpdesk/e/Ticket/new, entity: Ticket}
  # Home's My work: the open tickets assigned to you, due when their SLA wants them resolved.
  shell.work:
    - {id: tickets, title: Your tickets, endpoint: /api/app/helpdesk/work}
  # The workspace's portal: customers' own tickets at /portal/tickets/, where /open of a ticket
  # takes them.
  shell.portal:
    - {id: tickets, title: Your tickets, description: Ask for help and follow the team's answers, entity: Ticket, open: "t/{id}"}
  shell.notification:
    - {id: assigned, label: Tickets assigned to you, default: [inapp, email]}
    - {id: reply, label: Customer replies on your tickets, default: [inapp, email]}
    - {id: sla, label: SLA breaches on your tickets, default: [inapp, email]}
  # What the assistant should know in Helpdesk's pages, and what it suggests asking there.
  shell.assistant:
    - id: helpdesk
      title: "Helpdesk"
      instructions: >-
        A Ticket is Open, Replied, On Hold, Resolved or Closed. Its SLA (ServiceLevelAgreement, by priority) sets when
        a first response and a resolution are due, counted in working hours. TicketMessage holds the conversation. A
        KbArticle (Draft, Published, Archived) is the knowledge base. Warranty claims and maintenance visits are for
        customers' equipment.
      suggestions:
        - "Which tickets are about to miss their SLA?"
        - "How many tickets did each team resolve this week?"
        - "Which open tickets have waited longest for a reply?"
        - "Find an article about resetting a password"
