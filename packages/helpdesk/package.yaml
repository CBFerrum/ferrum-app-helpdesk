package: helpdesk
version: 0.2.0
label: Support
description: Helpdesk tickets with business-hours SLAs, teams with automatic assignment, a knowledge base, warranty claims and maintenance contracts with planned visits.
# Customers and items are shared with other apps; the links to ERP's invoices and orders come with
# the helpdesk_erp connector (Ferrum docs/plan/apps-ui.md §13).
depends: [core, parties, products]
field_prefix: sup_

overlays:
  - entity: Item
    ops:
      - {op: add_field, field: {name: sup_warranty_days, type: int, label: Warranty Period (Days), min: 0, max: 36500, description: "Warranty from the delivery date; warranty claims check against it"}}

modules:
  - name: support
    label: Support
    icon: life-buoy
    order: 45
    items: [Ticket, SavedReply, SupportMacro, WarrantyClaim, MaintenanceSchedule, MaintenanceVisit, KbArticle, KbCategory, ServiceLevelAgreement, SupportContract, EscalationRule,
            SupportTeam, TicketAssignmentRule, AgentProfile, TicketTag, TagRule, TicketType, SupportAddress, InboundLog, SupportSettings, report:support_ticket_summary,
            report:support_sla_compliance, report:support_response_times, report:support_agent_workload, report:support_customer_satisfaction, report:support_backlog,
            report:support_volume, report:support_reopens]

# What a personal-data request exports and erases for the person who raised tickets (their email):
# their name and address on the ticket; the conversation stays with the ticket.
personal_data:
  - {entity: Ticket, match: contact_email, erase: [contact_name, contact_email, cc]}
  - {entity: InboundLog, match: from_address, erase: [from_address, subject, payload]}
roles:
  - name: Support Agent
    description: Works tickets, writes knowledge base articles, logs warranty claims and maintenance visits. Give the user Support Team scopes to limit them to their teams' tickets.
    permissions:
      - {entity: Ticket, read: true, write: true, create: true, export: true}
      - {entity: TicketType, read: true}
      - {entity: SupportTeam, read: true}
      - {entity: ServiceLevelAgreement, read: true}
      - {entity: SupportContract, read: true}
      - {entity: SupportSettings, read: true}
      - {entity: SupportAddress, read: true}
      - {entity: TicketTag, read: true}
      - {entity: AgentProfile, read: true}
      - {entity: AgentProfile, read: true, write: true, create: true, if_owner: true}
      # Macros: those shared with a team or everyone, and the agent's own.
      - {entity: SupportMacro, read: true, where: {scope: [Team, Everyone]}}
      - {entity: SupportMacro, read: true, write: true, create: true, delete: true, if_owner: true}
      # Saved replies: those shared with a team or everyone, and the agent's own (Personal ones stay theirs).
      - {entity: SavedReply, read: true, where: {scope: [Team, Everyone]}}
      - {entity: SavedReply, read: true, write: true, create: true, delete: true, if_owner: true}
      - {entity: KbArticle, read: true, write: true, create: true}
      - {entity: KbCategory, read: true}
      - {entity: WarrantyClaim, read: true, write: true, create: true}
      - {entity: MaintenanceSchedule, read: true}
      - {entity: MaintenanceVisit, read: true, write: true, create: true, submit: true}
      - {entity: Customer, read: true}
      - {entity: CustomerGroup, read: true}
      - {entity: Item, read: true}
  - name: Support Manager
    description: Everything in support, including SLAs, assignment rules, teams and maintenance contracts.
    permissions:
      - {entity: Ticket, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: TicketType, read: true, write: true, create: true, delete: true}
      - {entity: SupportTeam, read: true, write: true, create: true, delete: true}
      - {entity: TicketAssignmentRule, read: true, write: true, create: true, delete: true}
      - {entity: ServiceLevelAgreement, read: true, write: true, create: true, delete: true}
      - {entity: SupportContract, read: true, write: true, create: true, delete: true}
      - {entity: EscalationRule, read: true, write: true, create: true, delete: true}
      - {entity: SupportSettings, read: true, write: true, create: true}
      - {entity: SupportAddress, read: true, write: true, create: true, delete: true}
      - {entity: InboundLog, read: true, write: true, delete: true}
      - {entity: AgentProfile, read: true, write: true, create: true, delete: true}
      - {entity: TicketTag, read: true, write: true, create: true, delete: true}
      - {entity: TagRule, read: true, write: true, create: true, delete: true}
      - {entity: SupportMacro, read: true, write: true, create: true, delete: true, where: {scope: [Team, Everyone]}}
      - {entity: SupportMacro, read: true, write: true, create: true, delete: true, if_owner: true}
      - {entity: SavedReply, read: true, write: true, create: true, delete: true, where: {scope: [Team, Everyone]}}
      - {entity: SavedReply, read: true, write: true, create: true, delete: true, if_owner: true}
      - {entity: KbArticle, read: true, write: true, create: true, delete: true}
      - {entity: KbCategory, read: true, write: true, create: true, delete: true}
      - {entity: WarrantyClaim, read: true, write: true, create: true, delete: true, export: true}
      - {entity: MaintenanceSchedule, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: MaintenanceVisit, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: Customer, read: true}
      - {entity: CustomerGroup, read: true}
      - {entity: Item, read: true}
      - {entity: SalesOrder, read: true}
      - {entity: SalesInvoice, read: true}
  - name: Knowledge Base Editor
    description: Writes and publishes knowledge base articles and organizes their categories.
    permissions:
      - {entity: KbArticle, read: true, write: true, create: true, delete: true}
      - {entity: KbCategory, read: true, write: true, create: true, delete: true}

seed:
  - entity: TicketType
    key: [type_name]
    records:
      - {type_name: Question}
      - {type_name: Incident}
      - {type_name: Problem}
      - {type_name: Feature Request}
  - entity: KbCategory
    key: [category_name]
    records:
      - {category_name: All Categories, is_group: true}
      - {category_name: General, parent_category: "@KbCategory:category_name=All Categories"}
  - entity: SavedReply
    key: [title]
    records:
      - {title: Thanks for getting in touch, scope: Everyone, body: "Hi {{customer.first_name}},\n\nThanks for getting in touch. I have your request ({{ticket.number}}) and will come back to you shortly.\n\n{{agent.first_name}}"}
      - {title: We are looking into it, scope: Everyone, body: "Hi {{customer.first_name}},\n\nI am looking into this now and will update you as soon as I know more.\n\n{{agent.first_name}}"}
      - {title: Is this resolved, scope: Everyone, body: "Hi {{customer.first_name}},\n\nI think this is sorted now. Could you check and let me know if anything is still wrong? If I do not hear back, I will close {{ticket.number}} in a few days.\n\n{{agent.first_name}}"}
handover:
  - {entity: Ticket, field: assigned_to, where: {status: [Open, Replied, On Hold]}}
  - {entity: SupportTeam, field: members.agent}
  - {entity: MaintenanceSchedule, field: assigned_to, where: {status: [Draft, Active]}}

# What the customer reads, in the workspace's words: Settings, Messages edits these.
messages:
  - key: helpdesk.reply
    label: Reply to a customer
    entity: Ticket
    category: operational
    channels: [email]
    values: [body, signature, link, files, attached]
    languages:
      en:
        email:
          subject: "Re: [{{ doc.number }}/{{ doc.mail_token }}] {{ doc.subject }}"
          body: "<div style=\"font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;color:#18181b;max-width:560px\">{{ values.body|safe }}{% if values.signature %}<div style=\"margin:0 0 12px\">{{ values.signature|safe }}</div>{% endif %}{% if values.files %}<p style=\"margin:0 0 12px;color:#52525b\">{% if values.attached %}Attached{% elif values.link %}Files with this reply (open the ticket to download them){% else %}Files with this reply{% endif %}: {{ values.files }}</p>{% endif %}<p style=\"margin:16px 0 0;padding-top:12px;border-top:1px solid #e4e4e7;color:#71717a;font-size:13px\">Ticket {{ doc.number }}{% if values.link %} &middot; <a href=\"{{ values.link|safe }}\" style=\"color:#52525b\">Follow it, or reply, here</a>{% endif %}</p></div>"
  - key: helpdesk.survey
    label: Ask the customer to rate the help
    entity: Ticket
    category: operational
    channels: [email]
    values: [url]
    languages:
      en:
        email:
          subject: "How did we do? {{ doc.number }}"
          body: "<p>Hello{% if doc.contact_name %} {{ doc.contact_name }}{% endif %},</p><p>Your request <b>{{ doc.number }}</b> ({{ doc.subject }}) was marked solved. <a href=\"{{ values.url|safe }}\">Tell us how we did</a>: it takes a moment, and the link works once.</p><p>Thank you.</p>"
  - key: helpdesk.survey_alert
    label: A low rating, to the lead
    entity: Ticket
    category: operational
    channels: [email]
    values: [rating]
    languages:
      en:
        email:
          subject: "A {{ values.rating }}-star rating on {{ doc.number }}"
          body: "<p>{{ doc.contact_name }} rated {{ doc.number }} ({{ doc.subject }}) {{ values.rating }} out of 5.</p><p>{{ doc.feedback }}</p>"
