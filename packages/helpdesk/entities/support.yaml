- name: SupportSettings
  label: Support Settings
  kind: settings
  module: support
  fields:
    - {name: auto_close_days, type: int, label: Close Resolved Tickets After (Days), default: 7, min: 0, max: 3650, description: "Resolved tickets without a customer reply close automatically after this many days; 0 = never"}
    - {name: outside_entitlement, type: select, options: [Inform, Hold for Approval], default: Inform, required: true, label: Tickets Outside Entitlement,
       description: "A ticket from a customer whose contract has ended or run out of tickets, or who has none. Inform: it is worked as any other, marked so. Hold for Approval: it waits On Hold, with no reply to the customer, until a Support Manager approves the work or declines it, saying why"}
    - {name: unknown_senders, type: select, options: [Open Ticket, Hold for Review, Ignore], default: Open Ticket, required: true, label: Mail From Unknown Senders,
       description: "What mail to a support address does when its sender is no customer's address (or contact's) and is not writing on a ticket. Open Ticket: the sender is the requester, with no customer. Hold for Review: it waits in the Inbound Mail Log for staff to open a ticket from it or discard it. Ignore: it is logged only"}
    - {name: unverified_senders, type: select, options: [Hold Failed, Hold All Unverified, Accept], default: Hold Failed, required: true, label: Mail That Fails Authentication,
       description: "What to do with mail from a known customer (or the requester or a copy of the ticket it answers) that the mail server did not verify. Hold Failed: a result that says it failed (DMARC failed, SPF and DKIM both failed, or a DKIM pass for another domain) waits in the Inbound Mail Log for staff, so a forged sender cannot steer a ticket; mail with no authentication result is taken and marked not verified on the message. Hold All Unverified: no result is held too (for a mail server that always adds one). Accept: taken, marked when not verified"}
    - {name: inbound_per_hour, type: int, default: 20, min: 0, max: 10000, label: Mail Taken From One Sender Per Hour, description: "More than this from one address in an hour is logged and not turned into tickets or messages; 0 = no limit"}
    - {name: inbound_log_days, type: int, default: 90, min: 1, max: 3650, label: Keep the Inbound Mail Log (Days)}
    - {name: at_risk_percent, type: int, default: 75, min: 1, max: 99, label: At Risk After (% of the Time), description: "A running target is At Risk when this share of the time between its start and its due moment has passed"}
    - {name: route_reopened, type: check, default: true, label: Route Reopened Tickets, description: "A ticket that is reopened goes through the assignment rules again when it has no agent or its agent cannot take it (away, off shift, no longer in the team)"}
    - {name: reassign_unanswered_hours, type: int, default: 0, min: 0, max: 8760, label: Reassign After Unanswered (Hours), description: "An open ticket nobody has answered for this many hours goes to the next available agent its rule picks (not the one who has it); 0 = never"}
    - {name: max_reassignments, type: int, default: 2, min: 1, max: 20, label: Reassignments Per Ticket}
    - {name: survey_enabled, type: check, default: false, label: Ask for a Rating When Solved, description: "A solved ticket's customer is mailed a link to rate it once"}
    - {name: survey_delay_hours, type: int, default: 1, min: 0, max: 720, label: Send the Survey After (Hours)}
    - {name: survey_link_days, type: int, default: 30, min: 1, max: 90, label: Survey Link Lasts (Days)}
    - {name: survey_reopen_at_or_below, type: int, default: 0, min: 0, max: 5, label: Reopen at a Rating of or Below, description: "A solved ticket rated this low or lower is reopened; 0 = never"}
    - {name: survey_alert_at_or_below, type: int, default: 0, min: 0, max: 5, label: Tell the Lead at a Rating of or Below, description: "0 = never"}
    - {name: survey_alert_to, type: email, label: Lead Told About Bad Ratings}
    - {name: defaults_made, type: check, hidden: true, read_only: true, no_copy: true}
    - {name: upkeep_done, type: data, max_length: 200, hidden: true, read_only: true, no_copy: true, description: "What the upkeep did once for this workspace when it was updated (calendars, counts, brands), so it is not done again over an administrator's changes"}

- name: TicketType
  label: Ticket Type
  kind: master
  module: support
  title_field: type_name
  fields:
    - {name: type_name, type: data, required: true, unique: true, in_list: true}
    - {name: description, type: text}
  list: {columns: [type_name], sort: type_name asc}

- name: SupportTeamMember
  label: Support Team Member
  kind: child
  fields:
    - {name: agent, type: email, required: true, in_list: true, description: "Email address the agent signs in with"}
    - {name: active, type: check, default: true, in_list: true, description: "Inactive members keep their tickets but get no new ones"}
    - {name: max_open_tickets, type: int, default: 0, min: 0, in_list: true, description: "Automatic assignment skips the agent at this many open tickets; 0 = no limit"}

- name: SupportTeam
  label: Support Team
  kind: master
  module: support
  title_field: team_name
  description: "Agents who share a ticket queue. Restrict an agent to their teams' tickets with a Support Team scope on the user."
  fields:
    - {name: team_name, type: data, required: true, unique: true, in_list: true}
    - {name: description, type: text}
    - {name: members, type: table, of: SupportTeamMember}
  list: {columns: [team_name], sort: team_name asc}

- name: TicketAssignmentRule
  label: Assignment Rule
  kind: master
  module: support
  title_field: rule_name
  description: "Routes new unassigned tickets, and reopened ones when Support Settings say so: the enabled rule with the highest priority whose condition matches picks the team and an agent in it."
  fields:
    - {name: rule_name, type: data, required: true, unique: true, in_list: true}
    - {name: team, type: link, to: SupportTeam, required: true, in_list: true, in_filter: true}
    - {name: condition, type: code, description: "CEL condition on the ticket, e.g. doc.priority == 'Urgent' && doc.channel == 'Email'; empty = every ticket"}
    - {name: rule_type, type: select, label: Rule, options: [Round Robin, Load Balancing], required: true, default: Round Robin, in_list: true, description: "Round Robin takes turns through the team; Load Balancing picks the agent with the fewest open tickets"}
    - {name: priority, type: int, default: 1, min: 1, max: 1000, in_list: true, description: "Rules with a higher priority are tried first"}
    - {name: enabled, type: check, default: true, in_list: true, in_filter: true}
    - {name: needs_skill, type: select, options: [No, Ticket Language, Fixed Skill], default: "No", required: true, label: Match Skill, description: "Ticket Language: only agents whose profile lists the ticket's language. Fixed Skill: only agents whose profile lists the skill below"}
    - {name: skill, type: data, max_length: 40, required_if: "doc.needs_skill == 'Fixed Skill'", visible_if: "doc.needs_skill == 'Fixed Skill'"}
    - {name: only_available, type: check, default: true, label: Only Agents Who Can Take It, description: "Skips agents who are away (Home, Away) or off shift (their profile's working calendar is closed now)"}
    - {name: fallback_agent, type: email, description: "Who gets the ticket when nobody in the team can take it; empty: it stays with the team, unassigned"}
    - {name: last_assigned_to, type: email, read_only: true, no_copy: true, description: "Round-robin position: the agent who got the previous ticket"}
  list: {columns: [rule_name, team, rule_type, priority, enabled], sort: priority desc}

- name: SlaPriority
  label: SLA Target
  kind: child
  fields:
    - {name: priority, type: select, options: [Low, Medium, High, Urgent], required: true, in_list: true}
    - {name: response_hours, type: decimal, label: Response Time (Hours), required: true, min: "0.01", max: "87600", in_list: true}
    - {name: resolution_hours, type: decimal, label: Resolution Time (Hours), required: true, min: "0.01", max: "87600", in_list: true}
  rules:
    - {name: resolution_after_response, check: "doc.resolution_hours >= doc.response_hours", message: "The resolution time cannot be shorter than the response time"}

- name: SlaWorkingHour
  label: SLA Working Hours
  kind: child
  fields:
    - {name: weekday, type: select, options: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday], required: true, in_list: true}
    - {name: start_time, type: data, required: true, max_length: 5, in_list: true, description: "HH:MM, 24-hour clock"}
    - {name: end_time, type: data, required: true, max_length: 5, in_list: true, description: "HH:MM; 24:00 = midnight. A night shift is one row per day, e.g. Monday 22:00-24:00 and Tuesday 00:00-06:00"}

- name: SlaHoliday
  label: SLA Holiday
  kind: child
  fields:
    - {name: holiday_date, type: date, required: true, in_list: true}
    - {name: description, type: data, in_list: true}

- name: ServiceLevelAgreement
  label: Service Level Agreement
  kind: master
  module: support
  title_field: sla_name
  description: "Response and resolution targets per priority, counted in working time on the agreement's own calendar, else on helpdesk_hours (Admin, Calendars: hours, time zone with daylight saving, dated exceptions). The most specific enabled agreement applies: customer, then customer group (nearest), then team and ticket type, then the default one without criteria. A customer's support contract can name one that applies whatever else would."
  fields:
    - {name: sla_name, type: data, label: Name, required: true, unique: true, in_list: true}
    - {name: enabled, type: check, default: true, in_list: true, in_filter: true}
    - {name: customer, type: link, to: Customer, in_list: true, description: "Applies only to this customer"}
    - {name: customer_group, type: link, to: CustomerGroup, in_list: true, description: "Applies to customers in this group and its sub-groups"}
    - {name: ticket_type, type: link, to: TicketType, in_list: true}
    - {name: team, type: link, to: SupportTeam, in_list: true, description: "Applies only to tickets of this team"}
    - {name: calendar, type: data, max_length: 64, in_list: true, label: Working Calendar, description: "The working calendar (Admin, Calendars: hours, a time zone with daylight saving, dated exceptions) this agreement's targets are counted on. Empty: the workspace's calendar helpdesk_hours. An agreement that had its own hours, holidays or time zone before 0.10 got a calendar made from them when the app was updated"}
    - {name: time_zone_offset, type: int, label: Time Zone (UTC Offset in Minutes), default: 0, min: -720, max: 840, hidden: true, description: "What the agreement had before 0.10: hours, holidays and a fixed time zone. Kept, and read once when the app is updated, to make the agreement's calendar and the workspace's helpdesk_hours; the calendar is what counts now"}
    - {name: pause_on_hold, type: check, label: Pause While On Hold, default: true}
    - {name: pause_on_replied, type: check, label: Pause While Awaiting the Customer (Replied), default: true}
    - {name: priorities, type: table, of: SlaPriority, label: Targets, required: true}
    - {name: working_hours, type: table, of: SlaWorkingHour, hidden: true, description: "See Time Zone"}
    - {name: holidays, type: table, of: SlaHoliday, hidden: true}
    - {name: description, type: text}
  list: {columns: [sla_name, customer, customer_group, team, ticket_type, enabled], sort: sla_name asc}

- name: EscalationRule
  label: Escalation Rule
  kind: master
  module: support
  title_field: rule_name
  description: "What happens when a ticket's agreement is at risk or breached. Rules fire in order of level, each at most once on a ticket, one per run of the SLA check."
  fields:
    - {name: rule_name, type: data, label: Name, required: true, unique: true, in_list: true}
    - {name: enabled, type: check, default: true, in_list: true, in_filter: true}
    - {name: level, type: int, required: true, default: 1, min: 1, max: 9, in_list: true}
    - {name: trigger, type: select, options: [At Risk, Breached], required: true, default: Breached, in_list: true}
    - {name: priority, type: select, options: [Low, Medium, High, Urgent], in_list: true, description: "Tickets of this priority; empty: any"}
    - {name: team, type: link, to: SupportTeam, in_list: true, description: "Tickets of this team; empty: any"}
    - {name: assign_to, type: email, description: "Who takes the ticket over"}
    - {name: move_to_team, type: link, to: SupportTeam}
    - {name: raise_priority_to, type: select, options: [High, Urgent], description: "Changes the ticket's targets too, from the next check"}
    - {name: notify, type: email, description: "Who is told, besides whoever the ticket is assigned to"}
  list: {columns: [level, rule_name, trigger, priority, team, enabled], sort: level asc}

- name: SupportContract
  label: Support Contract
  kind: master
  module: support
  title_field: contract_name
  description: "What a customer is entitled to: a period, optionally an agreement that applies whatever else would, and optionally a number of tickets."
  fields:
    - {name: contract_name, type: data, label: Name, required: true, unique: true, in_list: true}
    - {name: customer, type: link, to: Customer, required: true, in_list: true, in_filter: true, index: true}
    - {name: start_date, type: date, required: true, in_list: true}
    - {name: end_date, type: date, in_list: true, description: "Empty: open-ended"}
    - {name: service_level_agreement, type: link, to: ServiceLevelAgreement, label: SLA, in_list: true}
    - {name: included_tickets, type: int, min: 1, in_list: true, description: "Tickets covered in the contract's period; empty: unlimited"}
    - {name: notes, type: text}
  rules:
    - {name: period, check: "doc.end_date == null || doc.end_date >= doc.start_date", message: "A contract cannot end before it starts"}
  list: {columns: [contract_name, customer, start_date, end_date, included_tickets], sort: start_date desc}

- name: TicketMessage
  label: Ticket Message
  kind: child
  fields:
    - {name: author_kind, type: select, label: From, options: [Agent, Customer], required: true, default: Agent, in_list: true}
    - {name: author, type: email, required: true, in_list: true}
    - {name: body, type: markdown, required: true, in_list: true}
    - {name: is_internal, type: check, label: Internal Note, in_list: true, description: "Visible to agents only; does not count as a response"}
    - {name: sent_at, type: datetime, default_expr: now, in_list: true}
    - {name: attachments, type: json, description: "Files sent with the message: [{id}] of files uploaded through /api/files (up to 10, 20 MB together). The server fills in each file's name and size"}
    - {name: merged_from, type: data, read_only: true, no_copy: true, label: Merged From, description: "The ticket this message came from, when its ticket was merged into this one"}
    - {name: sender_unverified, type: check, read_only: true, no_copy: true, label: Sender Not Verified, description: "The mail server did not verify the sender of this message (it failed a check, or gave no result); not proof of forgery"}
    - {name: emailed, type: check, read_only: true, no_copy: true, description: "A reply that was emailed to the ticket's contact when it was sent (the address stays on the ticket, where a personal-data erasure reaches it)"}
    - {name: message_id, type: data, read_only: true, no_copy: true, hidden: true, description: "The mail's Message-ID, to thread a reply to it"}
    - {name: communication, type: data, read_only: true, no_copy: true, hidden: true, description: "The Mail message this one is (its id), when it came or went through Mail"}
    - {name: cc, type: text, read_only: true, no_copy: true, description: "Who else the message was copied to"}

- name: Ticket
  label: Ticket
  kind: document
  module: support
  title_field: subject
  numbering: {template: "TKT-{YYYY}-{seq:6}", date_field: opened_at}
  search_fields: [contact_email, contact_name, customer_name]
  owner_fields: [assigned_to]
  fields:
    - {name: subject, type: data, required: true, in_list: true, max_length: 300}
    - {name: description, type: markdown}
    - {name: status, type: select, options: [Open, Replied, On Hold, Resolved, Closed], required: true, default: Open, in_list: true, in_filter: true, index: true}
    - {name: priority, type: select, options: [Low, Medium, High, Urgent], required: true, default: Medium, in_list: true, in_filter: true}
    - {name: ticket_type, type: link, to: TicketType, label: Type, in_filter: true}
    - {name: channel, type: select, options: [Email, Portal, Phone, Chat, Web Form], required: true, default: Email, in_filter: true}
    - {name: customer, type: link, to: Customer, in_filter: true}
    - {name: customer_name, type: data, fetch_from: customer.customer_name, read_only: true, in_list: true}
    - {name: contact_name, type: data}
    - {name: contact_email, type: email, description: "Defaults to the customer's email"}
    - {name: team, type: link, to: SupportTeam, in_list: true, in_filter: true}
    - {name: assigned_to, type: email, in_list: true, in_filter: true, index: true}
    - {name: opened_at, type: datetime, required: true, default_expr: now, in_filter: true, index: true}
    - {name: first_responded_at, type: datetime, read_only: true, no_copy: true}
    - {name: resolved_at, type: datetime, read_only: true, no_copy: true, index: true}
    - {name: closed_at, type: datetime, read_only: true, no_copy: true}
    - {name: resolution_details, type: markdown, no_copy: true, required_if: "doc.status == 'Resolved' || doc.status == 'Closed'"}
    - {name: satisfaction_rating, type: int, label: Satisfaction (1-5), min: 1, max: 5, no_copy: true}
    - {name: feedback, type: text, no_copy: true}
    - {name: item, type: link, to: Item}
    - {name: serial_no, type: data, label: Serial No}
    - {name: conversation, type: table, of: TicketMessage, no_copy: true, description: "Append-only: sent messages cannot be edited or removed"}
    - {name: last_customer_message_at, type: datetime, read_only: true, no_copy: true, description: "When the customer last wrote"}
    - {name: last_agent_message_at, type: datetime, read_only: true, no_copy: true, description: "When the team last answered the customer (an internal note does not answer)"}
    - {name: last_message_preview, type: data, max_length: 200, read_only: true, no_copy: true, description: "The start of the latest message the customer could read, for the inbox"}
    - {name: support_contract, type: link, to: SupportContract, read_only: true, no_copy: true, in_filter: true}
    - {name: contract_sla, type: link, to: ServiceLevelAgreement, read_only: true, hidden: true, no_copy: true}
    - {name: entitlement, type: select, options: [Covered, Expired, Exhausted, None], read_only: true, no_copy: true, in_filter: true, description: "Whether a support contract covers this ticket, as of when it was opened"}
    - {name: entitlement_approval, type: select, options: [Waiting, Approved, Declined], read_only: true, no_copy: true, in_filter: true, label: Work Outside Entitlement,
       description: "Under Hold for Approval: whether a Support Manager has approved working this ticket"}
    - {name: entitlement_decided_by, type: email, read_only: true, no_copy: true, label: Decided By}
    - {name: entitlement_reason, type: data, read_only: true, no_copy: true, max_length: 500, label: Why}
    - {name: escalation_level, type: int, default: 0, read_only: true, no_copy: true, in_filter: true}
    - {name: escalated_at, type: datetime, read_only: true, no_copy: true}
    - {name: service_level_agreement, type: link, to: ServiceLevelAgreement, label: SLA, read_only: true, no_copy: true, in_filter: true}
    - {name: sla_status, type: select, label: SLA Status, options: [On Track, At Risk, Breached, Fulfilled], read_only: true, no_copy: true, in_list: true, in_filter: true}
    - {name: response_by, type: datetime, read_only: true, no_copy: true}
    - {name: resolution_by, type: datetime, read_only: true, no_copy: true}
    - {name: response_breached, type: check, read_only: true, no_copy: true, in_filter: true}
    - {name: resolution_breached, type: check, read_only: true, no_copy: true, in_filter: true}
    - {name: first_response_hours, type: decimal, precision: 2, read_only: true, no_copy: true, description: "Working hours the first response took on the platform's service target, pauses excluded"}
    - {name: resolution_hours, type: decimal, precision: 2, read_only: true, no_copy: true, description: "Working hours resolution took, pauses excluded"}
    - {name: paused_hours, type: decimal, precision: 2, read_only: true, no_copy: true, hidden: true, description: "Kept for tickets before 0.10; no longer worked out (the platform's target keeps the time worked, not the time stopped)"}
    - {name: response_state, type: select, options: [running, paused, met, met_late, breached], read_only: true, no_copy: true, in_filter: true, label: Response Target, description: "The platform's service target: the breach is recorded once and raises the ticket's updated event"}
    - {name: resolution_state, type: select, options: [running, paused, met, met_late, breached], read_only: true, no_copy: true, in_filter: true, label: Resolution Target}
    - {name: response_secs, type: int, read_only: true, no_copy: true, hidden: true, description: "Seconds of working time the agreement gives for a first response to this ticket's priority"}
    - {name: resolution_secs, type: int, read_only: true, no_copy: true, hidden: true}
    - {name: sla_calendar, type: data, read_only: true, no_copy: true, hidden: true, description: "The working calendar of the agreement that applies, which both targets count on; empty: helpdesk_hours"}
    - {name: sla_start, type: datetime, read_only: true, no_copy: true, hidden: true, description: "Where the targets' clocks start: the moment the ticket was opened (a backdated or imported ticket is due by its own opening), and the moment of a reopening"}
    - {name: sla_pause_hold, type: check, read_only: true, no_copy: true, hidden: true}
    - {name: sla_pause_replied, type: check, read_only: true, no_copy: true, hidden: true}
    - {name: status_history, type: json, read_only: true, hidden: true, no_copy: true}
    - {name: merged_into, type: link, to: Ticket, read_only: true, no_copy: true, in_filter: true, label: Merged Into, description: "Closed as a duplicate of this ticket, which holds its conversation now; a reply to this one lands there"}
    - {name: merged_at, type: datetime, read_only: true, no_copy: true}
    - {name: merged_by, type: email, read_only: true, no_copy: true}
    - {name: mail_token, type: data, read_only: true, no_copy: true, hidden: true, index: true, description: "A secret in the subject of the mail sent about this ticket, so a reply is matched to it by something nobody can guess"}
    - {name: channel_address, type: link, to: SupportAddress, read_only: true, no_copy: true, in_filter: true, label: Support Address, description: "The support address the customer wrote to"}
    - {name: cc, type: text, no_copy: true, label: Copied, description: "Addresses copied on the customer's mail; replies to the customer are copied to them too"}
    - {name: related_ticket, type: link, to: Ticket, read_only: true, no_copy: true, label: Follows Up, description: "The closed ticket this one continues: mail arrived on a ticket that was closed"}
    - {name: language, type: data, max_length: 35, in_filter: true, description: "The customer's language (a tag such as en or hi): assignment rules can look for agents who speak it"}
    - {name: routed_by, type: link, to: TicketAssignmentRule, read_only: true, no_copy: true}
    - {name: routed_at, type: datetime, read_only: true, no_copy: true}
    - {name: reassigned_count, type: int, default: 0, read_only: true, no_copy: true}
    - {name: reopen_count, type: int, default: 0, read_only: true, no_copy: true, in_filter: true, description: "How many times the ticket was reopened after being resolved"}
    - {name: survey_sent_at, type: datetime, read_only: true, no_copy: true}
    - {name: rated_at, type: datetime, read_only: true, no_copy: true}
  form:
    - {label: Ticket, fields: [subject, status, priority, ticket_type, channel, description]}
    - {label: Customer, fields: [customer, customer_name, contact_name, contact_email, cc]}
    - {label: Assignment, fields: [team, assigned_to, language]}
    - {label: Conversation, fields: [conversation]}
    - {label: Resolution, fields: [resolution_details, satisfaction_rating, feedback]}
    - {label: Entitlement, collapsible: true, fields: [support_contract, entitlement, entitlement_approval, entitlement_decided_by, entitlement_reason]}
    - {label: Service Level, collapsible: true, fields: [escalation_level, escalated_at, service_level_agreement, sla_status, response_by, resolution_by, response_breached, resolution_breached, opened_at, first_responded_at, resolved_at, closed_at, first_response_hours, resolution_hours, response_state, resolution_state]}
    - {label: Product, collapsible: true, fields: [item, serial_no, sales_invoice]}
  actions:
    - {name: merge_tickets, label: Merge Tickets Into This One, permission: write, condition: "doc.status != 'Closed'",
       params: [{name: numbers, label: Tickets to merge, type: text, required: true, description: "The numbers of the duplicates, separated by commas or lines. They must be this customer's; their conversation, files, watchers and tags move here, and they close as merged"}]}
    - {name: apply_macro, label: Apply a Macro, permission: write, condition: "doc.status != 'Closed'",
       params: [{name: macro, label: Macro, type: link, to: SupportMacro, required: true, description: "Its steps run in order on this ticket, all or none"}]}
    - {name: rate, label: Rate the Help, permission: read, condition: "(doc.status == 'Resolved' || doc.status == 'Closed') && !(doc.satisfaction_rating > 0)",
       params: [{name: rating, label: "How did we do? (1 to 5)", type: int, required: true, description: "1 is poor, 5 is excellent"}, {name: feedback, label: Comment, type: text}]}
    - {name: make_warranty_claim, label: Create Warranty Claim, permission: write, condition: "doc.item != null && doc.customer != null"}
    - {name: approve_outside_entitlement, label: Approve Work Outside Entitlement, permission: write, condition: "doc.entitlement_approval == 'Waiting'",
       params: [{name: reason, label: Why, type: data, required: true, description: "Why this customer's ticket is worked though their contract does not cover it"}]}
    - {name: decline_outside_entitlement, label: Decline Work Outside Entitlement, permission: write, condition: "doc.entitlement_approval == 'Waiting'",
       params: [{name: reason, label: Why, type: data, required: true, description: "Why it is not worked: the customer is told once someone replies"}]}
  targets:
    - {name: respond, label: First Response, calendar: helpdesk_hours, calendar_field: sla_calendar, start_field: sla_start, within: "doc.response_secs > 0 ? 'PT' + string(doc.response_secs) + 'S' : ''", pause_when: "(doc.status == 'On Hold' && doc.sla_pause_hold) || (doc.status == 'Replied' && doc.sla_pause_replied)",
       met_when: "!isEmpty(doc.first_responded_at)", due_field: response_by, state_field: response_state}
    - {name: resolve, label: Resolution, calendar: helpdesk_hours, calendar_field: sla_calendar, start_field: sla_start, within: "doc.resolution_secs > 0 ? 'PT' + string(doc.resolution_secs) + 'S' : ''", pause_when: "(doc.status == 'On Hold' && doc.sla_pause_hold) || (doc.status == 'Replied' && doc.sla_pause_replied)",
       met_when: "doc.status == 'Resolved' || doc.status == 'Closed'", due_field: resolution_by, state_field: resolution_state}
  list: {columns: [number, subject, customer_name, priority, status, assigned_to, sla_status], sort: opened_at desc}

- name: SavedReply
  label: Saved Reply
  label_plural: Saved Replies
  kind: master
  module: support
  title_field: title
  search_fields: [body]
  description: "A reply written once, inserted from a ticket's composer. The workspace's own merge fields are filled in from the ticket by the action Fill In for a Ticket: {{customer.first_name}}, {{customer.name}}, {{customer.company}}, {{ticket.number}}, {{ticket.subject}}, {{ticket.priority}}, {{ticket.status}}, {{ticket.link}}, {{agent.first_name}} and {{agent.name}}. A field that does not exist is left empty."
  fields:
    - {name: title, type: data, required: true, max_length: 120, in_list: true}
    - {name: scope, type: select, options: [Personal, Team, Everyone], required: true, default: Personal, in_list: true, in_filter: true, description: "Personal: only you. Team: the team's members. Everyone: every agent"}
    - {name: team, type: link, to: SupportTeam, in_list: true, in_filter: true, required_if: "doc.scope == 'Team'", visible_if: "doc.scope == 'Team'"}
    - {name: body, type: markdown, required: true, max_length: 20000}
    - {name: uses, type: int, label: Times Used, default: 0, read_only: true, no_copy: true, in_list: true}
  actions:
    - {name: used, label: Count a Use, permission: read}
    - {name: render, label: Fill In for a Ticket, permission: read, read_only: true,
       params: [{name: ticket, label: Ticket, type: link, to: Ticket, required: true}]}
  list: {columns: [title, scope, team, uses], sort: uses desc}

- name: KbCategory
  label: Knowledge Base Category
  label_plural: Knowledge Base Categories
  kind: master
  module: support
  title_field: category_name
  fields:
    - {name: category_name, type: data, required: true, unique: true, in_list: true}
    - {name: parent_category, type: link, to: KbCategory, link_filters: {is_group: true}, in_list: true}
    - {name: is_group, type: check, in_list: true}
    - {name: description, type: text}

- name: KbArticle
  label: Knowledge Base Article
  kind: master
  module: support
  title_field: title
  numbering: {template: "KB-{seq:5}"}
  fields:
    - {name: title, type: data, required: true, in_list: true, max_length: 300}
    - {name: category, type: link, to: KbCategory, required: true, link_filters: {is_group: false}, in_list: true, in_filter: true}
    - {name: status, type: select, options: [Draft, Published, Archived], required: true, default: Draft, in_list: true, in_filter: true}
    - {name: content, type: markdown, required: true}
    - {name: published_at, type: datetime, read_only: true, no_copy: true, in_list: true}
    - {name: helpful_count, type: int, label: Helpful, default: 0, read_only: true, no_copy: true, in_list: true}
    - {name: not_helpful_count, type: int, label: Not Helpful, default: 0, read_only: true, no_copy: true}
    - {name: visibility, type: select, options: [Internal, Customers Only, Public], default: Internal, required: true, in_list: true, in_filter: true,
       description: "Internal: agents only. Customers Only: signed-in customers in the portal. Public: the help centre page, to anyone (when published)"}
    - {name: slug, type: data, max_length: 120, unique: true, read_only: true, no_copy: true, description: "The article's address in the help centre, made from its title"}
    - {name: summary, type: data, max_length: 300, description: "A line for the help centre's list and for search engines"}
    - {name: views, type: int, default: 0, read_only: true, no_copy: true, label: Views}
  actions:
    - {name: mark_helpful, label: Helpful, permission: read, condition: "doc.status == 'Published'"}
    - {name: mark_not_helpful, label: Not Helpful, permission: read, condition: "doc.status == 'Published'"}
  list: {columns: [number, title, category, status, helpful_count], sort: title asc}

- name: WarrantyClaim
  label: Warranty Claim
  kind: document
  module: support
  title_field: customer_name
  numbering: {template: "WC-{YYYY}-{seq:5}", date_field: claim_date}
  search_fields: [serial_no]
  fields:
    - {name: claim_date, type: date, required: true, default_expr: today, in_list: true}
    - {name: status, type: select, options: [Open, Work In Progress, Closed], required: true, default: Open, in_list: true, in_filter: true}
    - {name: customer, type: link, to: Customer, required: true, in_filter: true}
    - {name: customer_name, type: data, fetch_from: customer.customer_name, read_only: true, in_list: true}
    - {name: item, type: link, to: Item, required: true, in_filter: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, in_list: true}
    - {name: serial_no, type: data, label: Serial No, in_list: true}
    - {name: complaint, type: text, required: true}
    - {name: delivery_date, type: date, description: "Taken from the serial number's delivery when it left stock on a delivery note or invoice; enter it otherwise"}
    - {name: delivery_reference, type: data, read_only: true, no_copy: true}
    - {name: warranty_expiry_date, type: date, read_only: true, no_copy: true}
    - {name: warranty_status, type: select, options: [Under Warranty, Out of Warranty, Under AMC], read_only: true, no_copy: true, in_list: true, in_filter: true, description: "Under AMC when an active maintenance schedule covers the item"}
    - {name: ticket, type: link, to: Ticket, read_only: true}
    - {name: resolution, type: text, no_copy: true, required_if: "doc.status == 'Closed'"}
    - {name: resolution_date, type: date, read_only: true, no_copy: true}
  rules:
    - {name: delivered_before_claim, check: "doc.delivery_date == null || doc.delivery_date <= doc.claim_date", message: "The delivery date is after the claim date"}
  actions:
    - {name: make_maintenance_visit, label: Create Maintenance Visit, permission: write, condition: "doc.status != 'Closed'"}
  list: {columns: [number, customer_name, item_name, serial_no, warranty_status, status], sort: claim_date desc}

- name: MaintenanceScheduleItem
  label: Maintenance Schedule Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, in_list: true}
    - {name: serial_no, type: data, label: Serial No, in_list: true}
    - {name: start_date, type: date, required: true, in_list: true}
    - {name: end_date, type: date, required: true, in_list: true}
    - {name: periodicity, type: select, options: [Weekly, Monthly, Quarterly, Half-yearly, Yearly], required: true, in_list: true}
    - {name: no_of_visits, type: int, label: Number of Visits, read_only: true, in_list: true}
  rules:
    - {name: end_after_start, check: "doc.end_date >= doc.start_date", message: "The end date is before the start date"}

- name: MaintenanceScheduleDetail
  label: Planned Visit
  kind: child
  fields:
    - {name: item, type: link, to: Item, in_list: true}
    - {name: item_name, type: data, in_list: true}
    - {name: serial_no, type: data, label: Serial No, in_list: true}
    - {name: scheduled_date, type: date, in_list: true}
    - {name: assigned_to, type: email, in_list: true}
    - {name: completion_status, type: select, options: [Pending, Partially Completed, Fully Completed], in_list: true}
    - {name: visit, type: link, to: MaintenanceVisit, in_list: true}
    - {name: actual_date, type: date, in_list: true}

- name: MaintenanceSchedule
  label: Maintenance Schedule
  kind: document
  module: support
  submittable: true
  title_field: customer_name
  numbering: {template: "MS-{YYYY}-{seq:5}", on: submit, date_field: transaction_date}
  description: "A maintenance contract (AMC): submitting plans the visits; cancelling drops the visits not yet made."
  fields:
    - {name: customer, type: link, to: Customer, required: true, in_filter: true}
    - {name: customer_name, type: data, fetch_from: customer.customer_name, read_only: true, in_list: true}
    - {name: transaction_date, type: date, required: true, default_expr: today, in_list: true}
    - {name: assigned_to, type: email, in_list: true, description: "Engineer for the planned visits"}
    - {name: items, type: table, of: MaintenanceScheduleItem, required: true}
    - {name: schedules, type: table, of: MaintenanceScheduleDetail, label: Visit Plan, read_only: true, no_copy: true}
    - {name: status, type: select, options: [Draft, Active, Completed, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true}
  actions:
    - {name: make_visit, label: Create Maintenance Visit, docstatus: [1], permission: read, condition: "doc.status == 'Active'"}
  list: {columns: [number, customer_name, transaction_date, assigned_to, status], sort: transaction_date desc}

- name: MaintenanceVisitPurpose
  label: Work Done
  kind: child
  fields:
    - {name: item, type: link, to: Item, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true}
    - {name: serial_no, type: data, label: Serial No, in_list: true}
    - {name: work_done, type: text, required: true, in_list: true}
    - {name: service_person, type: email, in_list: true}

- name: MaintenanceVisit
  label: Maintenance Visit
  kind: document
  module: support
  submittable: true
  title_field: customer_name
  numbering: {template: "MV-{YYYY}-{seq:5}", on: submit, date_field: visit_date}
  fields:
    - {name: customer, type: link, to: Customer, required: true, in_filter: true}
    - {name: customer_name, type: data, fetch_from: customer.customer_name, read_only: true, in_list: true}
    - {name: visit_date, type: date, required: true, default_expr: today, in_list: true}
    - {name: maintenance_type, type: select, options: [Scheduled, Unscheduled, Breakdown], required: true, default: Unscheduled, in_list: true, in_filter: true}
    - {name: maintenance_schedule, type: link, to: MaintenanceSchedule, in_filter: true}
    - {name: schedule_detail, type: data, label: Planned Visit, description: "Id of the visit-plan row this visit carries out"}
    - {name: warranty_claim, type: link, to: WarrantyClaim}
    - {name: completion_status, type: select, options: [Partially Completed, Fully Completed], in_list: true}
    - {name: work_done, type: table, of: MaintenanceVisitPurpose, required: true}
    - {name: customer_feedback, type: text}
  rules:
    - {name: scheduled_needs_schedule, check: "doc.maintenance_type != 'Scheduled' || doc.maintenance_schedule != null", message: "A scheduled visit needs its maintenance schedule"}
    - {name: completion_needed, check: "doc.completion_status != null", message: "Set the completion status before submitting", on: submit}
  list: {columns: [number, customer_name, visit_date, maintenance_type, completion_status], sort: visit_date desc}
